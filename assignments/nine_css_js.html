<!DOCTYPE html>
<html>
<head>
    <title>Form Example</title>
</head>
<body>

<form>

   
    <fieldset>
        <legend>Student Registration</legend>

        <p>Select Gender:</p>

        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other

        <br><br>

      
        <p>Select Hobbies:</p>

        <input type="checkbox" name="hobby" value="Reading"> Reading
        <input type="checkbox" name="hobby" value="Sports"> Sports
        <input type="checkbox" name="hobby" value="Music"> Music

        <br><br>

        <button type="button" onclick="showData()">
            Submit
        </button>

    </fieldset>

</form>

<h3 id="result"></h3>

<script>

function showData() {

    let gender = "";

    // Using FOR LOOP with radio buttons
    let radios = document.getElementsByName("gender");

    for (let i = 0; i < radios.length; i++) {

        if (radios[i].checked) {
            gender = radios[i].value;
        }
    }

    // Using FOR LOOP with checkboxes
    let hobbies = document.getElementsByName("hobby");

    let selectedHobbies = [];

    for (let i = 0; i < hobbies.length; i++) {

        if (hobbies[i].checked) {
            selectedHobbies.push(hobbies[i].value);
        }
    }

    // Display result
    document.getElementById("result").innerHTML =
        "Gender: " + gender +
        "<br>Hobbies: " + selectedHobbies.join(", ");
}

</script>

</body>
</html>
