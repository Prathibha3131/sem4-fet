<!DOCTYPE html>
<html>
<head>
    <title>Pull Down Menu and List Box</title>
</head>
<body>

<h2>Course Selection Form</h2>

<!-- Pull Down Menu -->
<label>Select Course:</label>

<select id="course">
    <option value="">--Choose Course--</option>
    <option value="Java">Java</option>
    <option value="Python">Python</option>
    <option value="JavaScript">JavaScript</option>
</select>

<br><br>

<!-- List Box -->
<label>Select Skills:</label>

<select id="skills" multiple size="4">
    <option value="HTML">HTML</option>
    <option value="CSS">CSS</option>
    <option value="React">React</option>
    <option value="NodeJS">NodeJS</option>
</select>

<br><br>

<button id="btn">Show Selection</button>

<h3 id="result"></h3>

<script>

// EVENT LISTENER for button
document.getElementById("btn").addEventListener("click", showData);

// Function
function showData() {

    // Pull Down Menu value
    let course =
        document.getElementById("course").value;

    // List Box values
    let skills =
        document.getElementById("skills");

    let selectedSkills = [];

    // FOR LOOP
    for (let i = 0; i < skills.options.length; i++) {

        if (skills.options[i].selected) {

            selectedSkills.push(
                skills.options[i].value
            );
        }
    }

    // Display Result
    document.getElementById("result").innerHTML =
        "Selected Course: " + course +
        "<br>Selected Skills: " +
        selectedSkills.join(", ");
}

</script>

</body>
</html>
