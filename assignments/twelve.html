<!DOCTYPE html>
<html>
<head>
  <title>Z-Index Example</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .container {
      position: relative;
      width: 500px;
      height: 300px;
      border: 2px solid black;
    }

    /* Bottom box */
    .box1 {
      position: absolute;
      top: 40px;
      left: 40px;

      width: 200px;
      height: 150px;

      background-color: lightblue;
      z-index: 1;
    }

    /* Middle box */
    .box2 {
      position: absolute;
      top: 80px;
      left: 120px;

      width: 200px;
      height: 150px;

      background-color: lightgreen;
      z-index: 2;
    }

    /* Top box */
    .box3 {
      position: absolute;
      top: 120px;
      left: 200px;

      width: 200px;
      height: 150px;

      background-color: coral;
      z-index: 3;
    }

    .box {
      color: white;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>

  <h1>Z-Index Example</h1>

  <p>
    Higher z-index values appear above lower z-index values.
  </p>

  <div class="container">

    <div class="box box1">
      z-index: 1
    </div>

    <div class="box box2">
      z-index: 2
    </div>

    <div class="box box3">
      z-index: 3
    </div>

  </div>

</body>
</html>
